<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Forex Journal — Login</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{--bg:#041026;--card:#081428;--muted:#99b0c6;--accent:#00c2a8}
    body{margin:0;font-family:Inter,system-ui,Arial;background:linear-gradient(180deg,#020617,#041026);color:#eaf6fb;display:flex;align-items:center;justify-content:center;height:100vh}
    .box{width:360px;padding:20px;border-radius:12px;background:linear-gradient(180deg,var(--card), rgba(255,255,255,0.01));box-shadow:0 10px 30px rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.03)}
    h2{margin:0 0 8px 0}
    label{font-size:13px;color:var(--muted);display:block;margin-top:10px}
    input{width:100%;padding:10px;margin-top:6px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:inherit}
    .btn{margin-top:14px;width:100%;padding:10px;border-radius:8px;border:none;background:var(--accent);color:#042021;font-weight:700;cursor:pointer}
    .link{margin-top:10px;font-size:13px;color:var(--muted);text-align:center}
    .toast{display:none;margin-top:10px;padding:8px;border-radius:8px;background:#022c2a;color:#d8fff7}
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="box">
    <h2>Welcome back</h2>
    <div class="small">Log in to your private Forex Journal</div>

    <label>Email</label>
    <input id="email" type="email" placeholder="you@example.com" />

    <label>Password</label>
    <input id="password" type="password" placeholder="Your password" />

    <button id="loginBtn" class="btn">Log in</button>

    <div class="link">New here? <a href="signup.html" style="color:var(--accent)">Create an account</a></div>
    <div id="toast" class="toast"></div>
  </div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyB3iCeZvXNdAe7S9COlr1oYLKjuyuddwnk",
    authDomain: "forex-journal-df760.firebaseapp.com",
    projectId: "forex-journal-df760",
    storageBucket: "forex-journal-df760.firebasestorage.app",
    messagingSenderId: "369895243855",
    appId: "1:369895243855:web:f7d1075a261599ff8b6a3a"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  const toastEl = document.getElementById('toast');
  function showToast(msg, ok=true){ toastEl.style.display='block'; toastEl.style.background = ok? '#022c2a':'#532323'; toastEl.textContent = msg; setTimeout(()=>toastEl.style.display='none',2500); }

  document.getElementById('loginBtn').addEventListener('click', async ()=>{
    const email = document.getElementById('email').value.trim();
    const pw = document.getElementById('password').value;
    if(!email || !pw){ showToast('Email and password required', false); return; }
    try{
      await auth.signInWithEmailAndPassword(email, pw);
      showToast('Login successful — redirecting');
      setTimeout(()=> location.href = 'journal.html', 600);
    }catch(err){
      showToast(err.message || 'Login failed', false);
    }
  });

  // if already logged in -> redirect
  auth.onAuthStateChanged(u => { if(u) location.href='journal.html'; });
</script>
</body>
</html>
